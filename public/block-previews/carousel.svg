  <text x="44" y="58" fill="#1e293b" font-family="Arial, sans-serif" font-size="24" font-weight="700">Conteúdo em sequência</text>
  <rect x="90" y="82" width="420" height="245" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="90" y="82" width="420" height="135" rx="16" fill="#0a3299"/><rect x="90" y="201" width="420" height="16" fill="#0a3299"/>
